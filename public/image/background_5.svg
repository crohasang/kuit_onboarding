<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- 그라데이션 -->
    <linearGradient id="auroraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.2">
        <animate attributeName="stop-color" 
          values="#4A90E2;#50E3C2;#E24A8D;#4A90E2" 
          dur="10s" 
          repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#50E3C2;stop-opacity:0.2">
        <animate attributeName="stop-color" 
          values="#50E3C2;#E24A8D;#4A90E2;#50E3C2" 
          dur="10s" 
          repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <!-- 별 패턴 -->
    <pattern id="starPattern" x="0" y="0" width="300" height="300" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.7" fill="#ffffff" opacity="0.5" />
      <circle cx="90" cy="25" r="0.8" fill="#ffffff" opacity="0.6" />
      <circle cx="180" cy="85" r="0.9" fill="#ffffff" opacity="0.7" />
      <circle cx="70" cy="150" r="0.8" fill="#ffffff" opacity="0.6" />
      <circle cx="230" cy="130" r="0.9" fill="#ffffff" opacity="0.7" />
      <circle cx="110" cy="290" r="0.8" fill="#ffffff" opacity="0.6" />
      <circle cx="250" cy="200" r="0.7" fill="#ffffff" opacity="0.5" />
      <circle cx="150" cy="120" r="0.8" fill="#ffffff" opacity="0.6" />
    </pattern>
  </defs>
  
  <!-- 배경 그라데이션 -->
  <rect width="100%" height="100%" fill="url(#auroraGrad1)"/>
  
  <!-- 별 패턴 -->
  <rect width="100%" height="100%" fill="url(#starPattern)" opacity="0.7"/>
  
  <!-- 오버레이 -->
  <rect width="100%" height="100%" fill="#B4A7D6" opacity="0.05"/>
</svg>